[experiment]
name = "plastic-real-template"

[environment]
backend = "balatro_sim"
num_envs = 1
strict_actions = true

[fly]
backend = "flywire"
mode = "mbon_direct"
artifact_path = "data/flywire/flywire_fafb_v783.npz"
device = "cuda"
duration_ms = 50.0
reset_fast_state_each_decision = true
sensory_mapping_seed = 0
sensory_population_width = 3
max_rate_hz = 150.0
motor_pool_width = 2
motor_mapping_path = "artefacts/motor-map-v783.json"

[motor]
deterministic_training = false
exploration_epsilon = 0.05
exploration_temperature = 1.0
exploration_seed = 2203

[plasticity]
learning_rate = 0.02
eligibility_decay = 0.90
dopamine_decay = 0.0
min_efficacy = 0.20
max_efficacy = 2.0
kc_reference_hz = 20.0
mbon_reference_hz = 20.0
max_eligibility = 4.0

[reinforcement]
# Predeclared sensitivity condition. Alternatives live in
# configs/reinforcement-sensitivity/ and are separate named experiments, never
# a parameter to retune until the score improves.
condition = "primary-progress"
progress_scale = 0.05
blind_clear_pulse = 0.40
ante_clear_pulse = 0.80
run_failure_pulse = 0.60
ante8_success_pulse = 1.50

[training]
# Non-scientific parser/calibration placeholder. flylatro-train refuses it;
# pass measured --max-environment-decisions and --budget-basis.
max_environment_decisions = 2
checkpoint_every_decisions = 2
budget_basis = "PLACEHOLDER_NOT_FOR_TRAINING"
base_fly_seed = 2001
plasticity_enabled = true

[curriculum]
# A single-level ladder is a fixed Ante-1 target, not a promotion curriculum.
enabled = true
ladder = [1]
promotion_win_rate = 0.70
# Unused for a single fixed level. Supply measured values when enabling the
# multi-Ante ladder after Ante-1 acceptance.
evaluation_every_decisions = 1
evaluation_episodes = 1

[calibration]
# Frozen reward-free evidence this experiment is authorized against.
# flylatro-preflight and flylatro-readiness read these paths directly and refuse
# a report whose recorded provenance belongs to another configuration.
corpus_path = "artefacts/calibration-corpus-v783.npz"
sensory_health_report = "artefacts/sensory-health-v783.json"
representation_pre_report = "artefacts/representation-pre-50ms.json"
representation_post_report = "artefacts/representation-post-50ms.json"
motor_calibration_report = "artefacts/motor-map-v783-report.json"
reachability_report = "artefacts/kc-reachability-50ms.json"
plasticity_report = "artefacts/plasticity-calibration.json"
specificity_report = "artefacts/chosen-action-specificity.json"
benchmark_report = "artefacts/bench-plastic-end-to-end.json"

[runtime]
output_root = "runs"
tensorboard = true
