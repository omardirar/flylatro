[experiment]
name = "showcase-neural-recording"

[environment]
backend = "balatro_sim"
num_envs = 1
strict_actions = true

[processor]
kind = "real"
artifact_path = "data/flywire/flywire_fafb_v783.npz"
duration_ms = 50.0
microbatch_size = 1
population_width = 3
readout_count = 1305
record_events = false

[policy]
hidden_size = 0

[ppo]
rollout_steps = 4
update_epochs = 1
minibatch_size = 4
max_updates = 1
checkpoint_every_updates = 1
seed = 1801

[reward]
shaping_beta = 0.0

[curriculum]
enabled = false

[evaluation]
stream = "showcase"
episodes = 1
seed_offset = 0
max_vector_steps = 30000
deterministic = true

[runtime]
device = "cuda"
output_root = "evaluations"
tensorboard = false
