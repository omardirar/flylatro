# Measured local calibration candidate, not an authorized training profile.
# The placeholder is intentional until representation and motor gates pass.
[experiment]
name = "plastic-v783-calibration"

[environment]
backend = "balatro_sim"
num_envs = 1
strict_actions = true

[fly]
backend = "flywire"
mode = "mbon_direct"
artifact_path = "data/flywire/flywire_fafb_v783.npz"
device = "cuda"
duration_ms = 50.0
reset_fast_state_each_decision = true
sensory_mapping_seed = 0
sensory_population_width = 3
max_rate_hz = 150.0
motor_pool_width = 2
motor_mapping_path = "artefacts/motor-map-v783-balanced-long.json"

[motor]
deterministic_training = false
exploration_epsilon = 0.05
exploration_temperature = 1.0
exploration_seed = 2203

[plasticity]
learning_rate = 0.02
eligibility_decay = 0.90
dopamine_decay = 0.0
min_efficacy = 0.20
max_efficacy = 2.0
kc_reference_hz = 20.0
mbon_reference_hz = 20.0
max_eligibility = 4.0

[reinforcement]
condition = "primary-progress"
progress_scale = 0.05
blind_clear_pulse = 0.40
ante_clear_pulse = 0.80
run_failure_pulse = 0.60
ante8_success_pulse = 1.50

[training]
max_environment_decisions = 2
checkpoint_every_decisions = 2
budget_basis = "PLACEHOLDER_NOT_FOR_TRAINING"
base_fly_seed = 2001
plasticity_enabled = true

[curriculum]
enabled = true
ladder = [1]
promotion_win_rate = 0.70
evaluation_every_decisions = 1
evaluation_episodes = 1

[calibration]
corpus_path = "artefacts/calibration-corpus-v783-balanced-long.npz"
sensory_health_report = "artefacts/sensory-health-v783-balanced-long.json"
representation_pre_report = "artefacts/representation-pre-balanced-long-50ms.json"
representation_post_report = "artefacts/representation-post-balanced-long-50ms.json"
motor_calibration_report = "artefacts/motor-map-v783-balanced-long-report.json"
reachability_report = "artefacts/kc-reachability-balanced-long-50ms.json"
plasticity_report = "artefacts/plasticity-calibration-balanced-long.json"
specificity_report = "artefacts/chosen-action-specificity-balanced-long.json"
benchmark_report = "artefacts/bench-plastic-end-to-end-balanced-long.json"

[runtime]
output_root = "runs"
tensorboard = false
